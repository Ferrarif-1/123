<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10231d" />
  <title>AI 智慧行程規劃器</title>
  <style>
    :root {
      --bg:#f5f2ea; --paper:#fffdf8; --ink:#17342b; --muted:#708078;
      --line:#dfe5df; --accent:#e87046; --accent2:#28745b; --soft:#e8f1ec;
      --shadow:0 18px 50px rgba(23,52,43,.12); --radius:22px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .hero{padding:54px clamp(20px,5vw,80px) 90px;background:linear-gradient(135deg,#10231d 0%,#1b4f3e 68%,#2b7359 100%);color:#fff;position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:rgba(255,255,255,.06);right:-100px;top:-170px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:1}
    .brand{font-weight:900;letter-spacing:.08em}.nav-actions{display:flex;gap:10px;flex-wrap:wrap}
    .hero-content{max-width:850px;margin-top:68px;position:relative;z-index:1}
    .eyebrow{color:#ffd1b8;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2.4rem,7vw,5.6rem);line-height:.98;margin:18px 0 22px;letter-spacing:-.045em}
    .hero p{font-size:1.08rem;line-height:1.8;max-width:680px;color:#dbe8e2}
    .shell{max-width:1180px;margin:-52px auto 70px;padding:0 20px;position:relative;z-index:2}
    .toolbar,.panel{background:var(--paper);border:1px solid rgba(23,52,43,.08);box-shadow:var(--shadow);border-radius:var(--radius)}
    .toolbar{padding:20px;display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:12px;align-items:end}
    label{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:7px}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff;color:var(--ink);outline:none;transition:.2s}
    input:focus,textarea:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(40,116,91,.12)}
    .btn{border:0;border-radius:13px;padding:12px 16px;font-weight:850;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{transform:translateY(-1px)} .primary{background:var(--accent);color:white}.secondary{background:var(--soft);color:var(--accent2)}
    .ghost{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.22)} .danger{background:#fff0ed;color:#b84631}
    .grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(285px,.75fr);gap:22px;margin-top:22px}
    .panel{padding:25px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
    .section-head h2{margin:0;font-size:1.4rem}.summary{font-size:.9rem;color:var(--muted)}
    .day{border-top:1px solid var(--line);padding:24px 0}.day:first-of-type{border-top:0;padding-top:0}
    .day-title{display:flex;gap:12px;align-items:center;margin-bottom:16px}.day-num{background:var(--ink);color:#fff;padding:7px 11px;border-radius:10px;font-weight:900}.day-title h3{margin:0;flex:1}
    .item{display:grid;grid-template-columns:80px 1fr auto;gap:14px;padding:16px;border:1px solid var(--line);border-radius:17px;margin:11px 0;background:white;transition:.2s}
    .item:hover{border-color:#b8c9bf;transform:translateY(-1px);box-shadow:0 8px 22px rgba(23,52,43,.07)}
    .time{font-weight:900;color:var(--accent2)}.item h4{margin:0 0 5px;font-size:1rem}.item p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6;white-space:pre-wrap}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1eee4;color:#6f624c;font-size:.73rem;font-weight:800;margin-top:8px}
    .icon-btn{border:0;background:transparent;padding:7px;border-radius:9px;color:var(--muted)}.icon-btn:hover{background:var(--soft);color:var(--ink)}
    .side-card{padding:16px;border-radius:17px;background:var(--soft);margin-bottom:14px}.side-card h3{margin:0 0 8px}.side-card p{font-size:.9rem;color:var(--muted);line-height:1.65;margin:0}
    .ai-card{background:linear-gradient(150deg,#17342b,#28664f);color:white}.ai-card p{color:#d9e8e1}.ai-card textarea{margin:12px 0;min-height:100px}
    .ai-output{white-space:pre-wrap;background:rgba(255,255,255,.1);padding:13px;border-radius:13px;font-size:.88rem;line-height:1.7;margin-top:12px;display:none}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border-radius:13px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.3rem}.stat span{font-size:.7rem;color:var(--muted)}
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(10,25,20,.56);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
    .modal.show{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
    .dialog h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#10231d;color:white;padding:12px 18px;border-radius:999px;z-index:50;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero{padding-bottom:80px}.hero-content{margin-top:45px}}
    @media(max-width:560px){.toolbar,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:64px 1fr}.item-actions{grid-column:2}.nav{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr 1fr}}
    @media print{.hero{padding:25px}.nav-actions,.toolbar,.side,.item-actions,.day-title button{display:none!important}.shell{margin:0;max-width:none}.grid{display:block}.panel{box-shadow:none;border:0}.item{break-inside:avoid}}
  </style>
</head>
<body>
  <header class="hero">
    <nav class="nav"><div class="brand">WANDER AI · 行程手帳</div><div class="nav-actions"><button class="btn ghost" onclick="window.print()">列印 / PDF</button><button class="btn ghost" onclick="exportData()">匯出 JSON</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">匯入</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></nav>
    <div class="hero-content"><div class="eyebrow">Editable travel planner</div><h1 id="heroTitle">我的旅行，<br>由我定義。</h1><p>完整可編輯的單檔行程網站。資料儲存在瀏覽器中，可新增、修改、刪除、匯出，也可使用內建 AI 助理檢查節奏並優化行程。</p></div>
  </header>

  <main class="shell">
    <section class="toolbar">
      <div><label>行程名稱</label><input id="tripTitle" value="京都秋日散策" oninput="updateMeta()"></div>
      <div><label>開始日期</label><input id="startDate" type="date" value="2026-11-12" onchange="updateMeta()"></div>
      <div><label>旅行天數</label><input id="tripDays" type="number" min="1" max="30" value="3" onchange="updateMeta()"></div>
      <button class="btn primary" onclick="openEditor()">＋ 新增行程</button>
    </section>

    <div class="grid">
      <section class="panel"><div class="section-head"><div><h2>每日行程</h2><div id="summary" class="summary"></div></div><button class="btn secondary" onclick="sortItems()">依時間排序</button></div><div id="itinerary"></div></section>
      <aside class="side">
        <section class="panel ai-card"><h2>✨ AI 行程助理</h2><p>輸入需求，AI 會根據目前行程提供調整建議。離線模式不需金鑰；進階模式可串接相容 API。</p><textarea id="aiPrompt" placeholder="例如：請幫我檢查第二天是否太趕，並建議適合雨天的替代方案。"></textarea><button class="btn primary" style="width:100%" onclick="askAI()">分析目前行程</button><div id="aiOutput" class="ai-output"></div></section>
        <section class="panel" style="margin-top:22px"><h2>旅程總覽</h2><div class="stats"><div class="stat"><strong id="statDays">0</strong><span>天數</span></div><div class="stat"><strong id="statItems">0</strong><span>行程</span></div><div class="stat"><strong id="statFood">0</strong><span>美食</span></div></div><div class="side-card" style="margin-top:15px"><h3>住宿</h3><p contenteditable="true" oninput="saveNote('hotel',this.innerText)" id="hotelNote">京都站附近飯店，可點此直接修改。</p></div><div class="side-card"><h3>備忘錄</h3><p contenteditable="true" oninput="saveNote('memo',this.innerText)" id="memoNote">攜帶雨具、交通卡與行動電源。</p></div></section>
        
      </aside>
    </div>
  </main>

  <div class="modal" id="modal" onclick="if(event.target===this)closeEditor()"><div class="dialog"><h2 id="dialogTitle">新增行程</h2><div class="form-grid">
    <div><label>第幾天</label><input id="fDay" type="number" min="1" value="1"></div><div><label>時間</label><input id="fTime" type="time" value="09:00"></div>
    <div class="full"><label>行程標題</label><input id="fTitle" placeholder="例如：清水寺散策"></div>
    <div><label>類別</label><select id="fCategory"><option>景點</option><option>美食</option><option>交通</option><option>住宿</option><option>購物</option><option>其他</option></select></div>
    <div><label>地點</label><input id="fLocation" placeholder="地點或地址"></div>
    <div class="full"><label>說明</label><textarea id="fNote" rows="4" placeholder="交通方式、預約資訊、注意事項…"></textarea></div>
  </div><div class="dialog-actions"><button class="btn secondary" onclick="closeEditor()">取消</button><button class="btn primary" onclick="saveItem()">儲存</button></div></div></div>
  <div class="toast" id="toast"></div>

  <script>
    let editingId=null;
    const defaults={meta:{title:'京都秋日散策',startDate:'2026-11-12',days:3},notes:{hotel:'京都站附近飯店，可點此直接修改。',memo:'攜帶雨具、交通卡與行動電源。'},items:[
      {id:crypto.randomUUID(),day:1,time:'09:00',title:'伏見稻荷大社',category:'景點',location:'伏見區',note:'早晨出發避開人潮，預留約 2 小時。'},
      {id:crypto.randomUUID(),day:1,time:'12:00',title:'祇園午餐',category:'美食',location:'祇園',note:'品嚐京都家常料理。'},
      {id:crypto.randomUUID(),day:1,time:'14:00',title:'清水寺與二年坂',category:'景點',location:'東山區',note:'步行散策，傍晚欣賞街景。'},
      {id:crypto.randomUUID(),day:2,time:'09:30',title:'嵐山竹林',category:'景點',location:'嵐山',note:'搭乘電車前往，順遊渡月橋。'},
      {id:crypto.randomUUID(),day:2,time:'13:30',title:'金閣寺',category:'景點',location:'北區',note:'注意跨區移動時間。'},
      {id:crypto.randomUUID(),day:3,time:'10:00',title:'錦市場',category:'美食',location:'中京區',note:'邊走邊吃，採買伴手禮。'}]};
    let state=structuredClone(defaults);
    function persist(){render()}
    function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function dateForDay(day){if(!state.meta.startDate)return '';const d=new Date(state.meta.startDate+'T00:00:00');d.setDate(d.getDate()+day-1);return d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'})}
    function render(){
      tripTitle.value=state.meta.title;startDate.value=state.meta.startDate;tripDays.value=state.meta.days;heroTitle.innerHTML=esc(state.meta.title)+'，<br>由我定義。';hotelNote.innerText=state.notes.hotel;memoNote.innerText=state.notes.memo;
      const root=document.getElementById('itinerary');let html='';
      for(let d=1;d<=state.meta.days;d++){const list=state.items.filter(x=>+x.day===d).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day"><div class="day-title"><span class="day-num">DAY ${d}</span><h3>${dateForDay(d)}</h3><button class="btn secondary" onclick="openEditor(null,${d})">＋</button></div>`;html+=list.length?list.map(x=>`<article class="item"><div class="time">${esc(x.time)}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.location)}${x.location&&x.note?' · ':''}${esc(x.note)}</p><span class="tag">${esc(x.category)}</span></div><div class="item-actions"><button class="icon-btn" title="編輯" onclick="openEditor('${x.id}')">✎</button><button class="icon-btn" title="刪除" onclick="removeItem('${x.id}')">×</button></div></article>`).join(''):'<div class="empty">這天還沒有行程，點右上角 ＋ 新增。</div>';html+='</div>'}
      root.innerHTML=html;const count=state.items.length;summary.textContent=`${state.meta.days} 天 · ${count} 個行程 · ${state.meta.startDate||'尚未設定日期'}`;statDays.textContent=state.meta.days;statItems.textContent=count;statFood.textContent=state.items.filter(x=>x.category==='美食').length;
    }
    function updateMeta(){state.meta={title:tripTitle.value.trim()||'我的旅行',startDate:startDate.value,days:Math.max(1,Math.min(30,+tripDays.value||1))};state.items=state.items.filter(x=>+x.day<=state.meta.days);persist()}
    function saveNote(k,v){state.notes[k]=v}
    function openEditor(id=null,day=1){editingId=id;const x=id?state.items.find(i=>i.id===id):null;dialogTitle.textContent=x?'編輯行程':'新增行程';fDay.value=x?.day||day;fDay.max=state.meta.days;fTime.value=x?.time||'09:00';fTitle.value=x?.title||'';fCategory.value=x?.category||'景點';fLocation.value=x?.location||'';fNote.value=x?.note||'';modal.classList.add('show');setTimeout(()=>fTitle.focus(),50)}
    function closeEditor(){modal.classList.remove('show');editingId=null}
    function saveItem(){if(!fTitle.value.trim())return toast('請輸入行程標題');const item={id:editingId||crypto.randomUUID(),day:Math.max(1,Math.min(state.meta.days,+fDay.value||1)),time:fTime.value||'09:00',title:fTitle.value.trim(),category:fCategory.value,location:fLocation.value.trim(),note:fNote.value.trim()};if(editingId)state.items=state.items.map(x=>x.id===editingId?item:x);else state.items.push(item);closeEditor();persist();toast('行程已儲存')}
    function removeItem(id){if(confirm('確定刪除這個行程？')){state.items=state.items.filter(x=>x.id!==id);persist();toast('已刪除')}}
    function sortItems(){state.items.sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));persist();toast('已依日期與時間排序')}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.meta.title||'trip')+'.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.meta||!Array.isArray(data.items))throw 0;state=data;state.notes||={hotel:'',memo:''};persist();toast('匯入完成')}catch{alert('檔案格式不正確')}};r.readAsText(f);e.target.value=''}
    function offlineAI(prompt){const byDay={};state.items.forEach(x=>(byDay[x.day]??=[]).push(x));let lines=[`行程「${state.meta.title}」分析結果：`];for(let d=1;d<=state.meta.days;d++){const a=byDay[d]||[];lines.push(`\n第 ${d} 天：${a.length} 個行程`);if(a.length===0)lines.push('• 建議至少安排一個主要活動，並保留彈性。');if(a.length>=5)lines.push('• 行程偏滿，建議刪減 1 至 2 個點或增加休息時間。');for(let i=1;i<a.length;i++){const prev=+a[i-1].time.slice(0,2)*60 + +a[i-1].time.slice(3);const cur=+a[i].time.slice(0,2)*60 + +a[i].time.slice(3);if(cur-prev<45)lines.push(`• ${a[i-1].time}「${a[i-1].title}」到 ${a[i].time}「${a[i].title}」間隔較短，請確認交通時間。`)}}
      if(/雨|雨天/.test(prompt))lines.push('\n雨天建議：優先保留室內餐飲、購物或展館類活動，戶外景點可改為彈性備案。');if(/美食|餐/.test(prompt))lines.push('\n用餐建議：熱門餐廳可先預約，並在跨區移動前後預留緩衝。');lines.push('\n整體建議：每日保留至少一段 30 至 60 分鐘的彈性時間，並將同區域景點集中安排。');return lines.join('\n')}
    function askAI(){const box=aiOutput,prompt=aiPrompt.value.trim()||'請分析目前行程的節奏與動線。';box.style.display='block';box.textContent=offlineAI(prompt)}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});render();
  </script>
</body>
</html>
